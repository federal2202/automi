name: tests

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: automi_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: backend/pnpm-lock.yaml }
      - run: cd backend && pnpm install --frozen-lockfile
      - run: cd backend && npx prisma generate
      - run: cd backend && npx tsc --noEmit
      - run: cd backend && pnpm test
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5433/automi_test
          JWT_SECRET: ci-secret
          JWT_REFRESH_SECRET: ci-refresh
          GEMINI_API_KEY: ci-fake-key

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd ai-service && pip install -r requirements.txt -r requirements-dev.txt
      - run: cd ai-service && python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && pnpm test
